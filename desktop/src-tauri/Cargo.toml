[package]
name = "marginalia-desktop"
version = "0.1.0"
description = "Marginalia as a Mac app: runs the server in the background, with a menu-bar Tunnel switch"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde_json = "1"
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
